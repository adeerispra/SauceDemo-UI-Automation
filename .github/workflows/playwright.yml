name: Playwright UI Automation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - all

jobs:
  test:
    name: Playwright ${{ github.event.inputs.suite || 'smoke' }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.suite == 'smoke' }}
        run: npm run test:ci

      - name: Run sanity suite
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'sanity' }}
        run: npm run test:sanity

      - name: Run regression suite
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'regression' }}
        run: npm run test:regression

      - name: Run all tests
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'all' }}
        run: npm test

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
